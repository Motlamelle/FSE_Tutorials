services:
 - type: web
   name: app
   runtime: python
   plan: free
   buildCommand: pip install -r requirements.txt
   startCommand: gunicorn app:app --bind 0.0.0.0:8000   # nginix an alternative to gunicorn
   envVars:
    - key: PYTHON_VERSION
      value: 3.11.11
    - key: SECRET_KEY
      generate: true
    - key: DATABASE_URL
      value: sqlite:///data/finance.db
    - key: CURRENCY_SYMBOL
      value: R